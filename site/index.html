<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Compare Crusalis resources by side, nation, and town.">
  <meta name="color-scheme" content="dark light">
  <title>Crusalis Resources</title>
  <link rel="preload" href="./fonts/ibm-plex-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <script src="./theme.js"></script>
  <link rel="stylesheet" href="./styles.css">
  <script src="./alliances.js" defer></script>
  <script src="./ledger.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body>
  <main>
    <header class="masthead">
      <div class="masthead-title">
        <h1>Crusalis Resources</h1>
        <p class="lede">Made by tsuki</p>
      </div>
      <div class="masthead-actions">
        <p class="freshness"><span id="freshness-dot" class="freshness-dot" aria-hidden="true"></span><time id="freshness">Loading snapshot…</time></p>
        <div id="theme-switch" class="theme-switch" role="group" aria-label="Theme">
          <button type="button" data-theme-choice="dark" aria-pressed="true">Dark</button>
          <button type="button" data-theme-choice="light" aria-pressed="false">Light</button>
        </div>
        <button id="reload" class="button" type="button" aria-label="Reload snapshot" title="Reload the latest published snapshot">
          <svg class="icon" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"/><path d="M13.5 2.5v3h-3"/></svg>
          <span class="button-label">Reload</span>
        </button>
      </div>
    </header>

    <p id="status" role="status" aria-live="polite">Loading resource data…</p>

    <section class="totals" aria-labelledby="totals-title">
      <div class="section-head">
        <h2 id="totals-title">Totals by side</h2>
        <p id="totals-note" class="note"></p>
      </div>
      <div class="table-scroll">
        <table id="totals" class="ledger totals-table" aria-labelledby="totals-title"></table>
      </div>
    </section>

    <section class="nations" aria-labelledby="nations-title">
      <div class="section-head">
        <h2 id="nations-title">Nations and towns</h2>
        <p id="summary" class="note" aria-live="polite"></p>
      </div>
      <div class="toolbar">
        <div id="side-filter" class="side-filter" role="group" aria-label="Show side"></div>
        <form id="search-form" class="search" role="search">
          <label class="visually-hidden" for="search">Search towns or nations</label>
          <svg class="icon search-icon" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3"/></svg>
          <input id="search" type="search" placeholder="Search towns or nations" autocomplete="off" spellcheck="false" maxlength="100">
          <button id="clear-search" class="text-button" type="button" hidden>Clear</button>
        </form>
      </div>
      <div class="compare" role="group" aria-labelledby="compare-label">
        <p id="compare-label" class="note">Compare by</p>
        <div id="compare-buttons" class="compare-buttons"></div>
      </div>
      <div id="side-summary" class="side-summary"></div>
      <div class="table-scroll">
        <table id="nations" class="ledger nations-table" aria-labelledby="nations-title"></table>
      </div>
      <noscript><p>Enable JavaScript to browse towns, or <a href="./data/resources.json">download the resource snapshot</a>.</p></noscript>
    </section>

  </main>
</body>
</html>
