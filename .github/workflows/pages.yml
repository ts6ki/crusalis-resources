name: Update resources and deploy Pages

on:
  push:
  workflow_dispatch:
  schedule:
    # Every 2 hours at minute 17 (UTC). Off the hour, when GitHub's scheduler is busiest.
    - cron: '17 */2 * * *'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test data collector
        run: python -m unittest discover -s tests -v
      - name: Test page logic
        run: |
          node --check site/app.js
          node --test tests/alliances.test.cjs tests/ledger.test.cjs
      - name: Fetch and validate current resources
        run: python scripts/update_data.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
